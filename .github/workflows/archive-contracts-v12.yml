name: Archived CI contract verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: archive-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  historical-config-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Archived-workflow and environment contract regression
        run: |
          python -m pytest -q \
            tests/test_disabled_workflow_archive_contract.py \
            tests/test_ci_workflow_contract.py \
            tests/test_daily_analysis_workflow_data_sources.py \
            tests/test_daily_analysis_workflow_llm_env.py \
            tests/test_daily_analysis_workflow_notification_env.py \
            tests/test_futu_distribution_contract.py \
            tests/test_packaging_build_scripts.py \
            tests/test_searxng_env_docs.py \
            tests/test_config_registry.py \
            tests/test_us_routing_priority.py
