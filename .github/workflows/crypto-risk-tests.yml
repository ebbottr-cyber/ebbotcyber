name: EBBot Crypto Risk Offline Checks

on:
  pull_request:
    paths:
      - "src/services/crypto_risk_*.py"
      - "api/v1/endpoints/crypto_risk.py"
      - "api/v1/router.py"
      - "apps/dsa-web/src/api/cryptoRisk*"
      - "apps/dsa-web/src/components/crypto/CryptoRiskPanel*"
      - "apps/dsa-web/src/pages/CryptoTradingPage.tsx"
      - "tests/test_crypto_risk_*.py"
      - ".github/workflows/crypto-risk-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-crypto-risk:
    name: Python crypto risk unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: python -m pip install "httpx>=0.27,<1"
      - name: Verify risk engine, ledger and audit
        env:
          TRADING_ENABLED: "false"
        run: python -m unittest discover -s tests -p "test_crypto_risk_*.py" -v

  react-crypto-risk:
    name: TypeScript crypto risk tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test crypto risk API and UI
        run: npm run test -- src/api/cryptoRisk.test.ts src/components/crypto/CryptoRiskPanel.test.tsx
      - name: Build whole frontend to catch regressions
        run: npm run build
