name: EBBot auth hardening focused regression (no trading)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/auth.py'
      - 'api/v1/endpoints/auth.py'
      - 'apps/dsa-web/src/contexts/AuthContext.tsx'
      - 'apps/dsa-web/src/contexts/__tests__/AuthContext.test.tsx'
      - 'tests/test_auth.py'
      - 'tests/test_auth_api.py'
      - '.github/workflows/ebbot-auth-hardening-focused.yml'

permissions:
  contents: read

concurrency:
  group: ebbot-auth-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked backend CI requirements
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Test admin env, signed session and real ASGI auth contracts
        run: python -m pytest -q tests/test_auth.py tests/test_auth_api.py tests/test_auth_status_setup_state.py

  react-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: Checkout without credential persistence
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: Install frontend requirements
        run: npm ci --no-audit --no-fund
      - name: Focused React auth regression
        run: npx vitest run src/contexts/__tests__/AuthContext.test.tsx
      - name: TypeScript and production build
        run: npm run build
