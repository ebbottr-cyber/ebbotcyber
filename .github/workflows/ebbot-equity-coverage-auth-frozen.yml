name: EBBot equity coverage auth and frozen Windows safety (DRAFT)

on:
  push:
    branches:
      - test/ebbot-equity-coverage-auth-frozen-20261121
  pull_request:
    paths:
      - 'api/v1/endpoints/data.py'
      - 'src/services/equity_data_coverage_reader.py'
      - 'tests/test_equity_coverage_api_auth.py'
      - 'tests/test_equity_coverage_windows_packaging.py'
      - 'scripts/build-backend.ps1'
      - 'tests/test_ebbot_packaged_react_probe.py'
      - 'apps/dsa-web/src/components/data-center/EquityCoveragePanel*'
      - '.github/workflows/ebbot-equity-coverage-auth-frozen.yml'

permissions:
  contents: read

jobs:
  authenticated-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCHEDULE_ENABLED: 'false'
      RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
      MEME_RADAR_LIVE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install CI dependencies without secrets
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Real API session, no path injection and auth-disabled fail closed
        run: python -m pytest -q tests/test_equity_coverage_api_auth.py
      - name: Original bounded reader regression
        run: python -m unittest discover -s tests -p 'test_equity_data_coverage_reader.py' -v
      - name: CI-only frozen React probe must hide real coverage API
        run: python -m pytest -q tests/test_ebbot_packaged_react_probe.py
      - name: Static Windows packaging guard
        run: python -m unittest discover -s tests -p 'test_equity_coverage_windows_packaging.py' -v

  turkish-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Coverage UI fail-closed states
        run: npm run test -- src/components/data-center/EquityCoveragePanel.test.tsx
      - name: ESLint
        run: npm run lint
      - name: Production TypeScript and Vite build
        run: npm run build

  windows-source:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      SCHEDULE_ENABLED: 'false'
      RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
      MEME_RADAR_LIVE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Windows packager references without packaging or executing
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_equity_coverage_windows_packaging.py -v
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging contract failed" }
          python -m compileall -q api/v1/endpoints/data.py src/services/equity_data_coverage_reader.py
          if ($LASTEXITCODE -ne 0) { throw "Coverage modules did not compile" }
      - name: Block distribution and trading
        shell: pwsh
        run: |
          "Release: BLOCKED; never publish Electron artifacts or installers" >> $env:GITHUB_STEP_SUMMARY
          "No real provider requests, paper fills or live orders" >> $env:GITHUB_STEP_SUMMARY
