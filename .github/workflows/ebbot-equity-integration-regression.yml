name: EBBot equity stack combined regression (DRAFT NO RELEASE)

on:
  push:
    branches:
      - integration/ebbot-equity-full-review-20261121
  pull_request:
    paths:
      - 'scripts/audit_ebbot_*.py'
      - 'scripts/stage_ebbot_equity_ohlcv.py'
      - 'src/services/bist_identity_report_reader.py'
      - 'src/services/equity_data_coverage_reader.py'
      - 'api/v1/endpoints/data.py'
      - 'apps/dsa-web/src/**'
      - 'tests/test_ebbot_*.py'
      - '.github/workflows/ebbot-equity-integration-regression.yml'
      - 'docs/EBBOT_EQUITY_INTEGRATION_MAIN_REVIEW_TR.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equity-integration-review-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEDULE_ENABLED: 'false'
  RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
  MEME_RADAR_LIVE_ENABLED: 'false'
  MEME_COIN_DISCOVERY_ENABLED: 'false'

jobs:
  integrated-offline-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install repo CI dependency manifest
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Full backend regression without tests marked network
        run: python -m pytest -q -m 'not network' -r a
      - name: Immutable market research only
        run: |
          python - <<'PY'
          from scripts.audit_ebbot_equity_provider_readiness import audit_provider_readiness
          from scripts.audit_ebbot_bist_reference_identity import reconcile_bist
          from src.services.bist_identity_report_reader import read_bist_identity_summary
          from src.services.equity_data_coverage_reader import read_equity_coverage_report
          p = audit_provider_readiness()
          b = reconcile_bist()
          assert p["status"] == "BLOCKED_NOT_APPROVED_FOR_DATA_INGESTION_OR_TRADING"
          assert p["may_auto_import_quotes"] is False
          assert b["status"] == "BLOCKED_MISSING_BIST_SOURCE_FILES"
          assert b["counts_unknown_not_zero"] is True
          assert read_bist_identity_summary("")["counts"] is None
          assert read_equity_coverage_report("")["markets"] == {}
          assert p["orders"] == b["orders"] == 0
          assert not p["live_trading_enabled"] and not b["paper_trading_enabled"]
          print("No operator files/credentials: missing data stays unknown. Trading not enabled.")
          PY

  windows-bist-kap-and-ohlcv:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all operator read-only evidence modules
        shell: pwsh
        run: |
          python -m compileall -q scripts/audit_ebbot_market_data_coverage.py scripts/audit_ebbot_kap_market_inventory.py scripts/audit_ebbot_kap_bist_crosswalk.py scripts/audit_ebbot_equity_session_gaps.py scripts/stage_ebbot_equity_ohlcv.py scripts/audit_ebbot_bist_reference_identity.py src/services/equity_data_coverage_reader.py src/services/bist_identity_report_reader.py
          if ($LASTEXITCODE -ne 0) { throw "Windows source compile failed" }
      - name: Full synthetic Windows staging and operator report reader regression
        shell: pwsh
        run: |
          $patterns = @(
            'test_ebbot_windows_equity_e2e.py',
            'test_ebbot_windows_bist_packaging.py',
            'test_equity_coverage_windows_packaging.py',
            'test_ebbot_kap_market_inventory.py',
            'test_ebbot_kap_bist_crosswalk.py',
            'test_ebbot_bist_reference_identity.py',
            'test_bist_identity_report_reader.py',
            'test_ebbot_equity_provider_readiness.py',
            'test_ebbot_equity_ohlcv_staging.py',
            'test_ebbot_equity_session_gaps.py',
            'test_ebbot_market_data_coverage.py',
            'test_equity_data_coverage_reader.py'
          )
          foreach ($pattern in $patterns) {
            python -m unittest discover -s tests -p $pattern -v
            if ($LASTEXITCODE -ne 0) { throw "Windows regression failed for $pattern" }
          }
      - name: Do not certify Windows executable or trading rights
        shell: pwsh
        run: |
          "PASS here means Python tests on Windows and static packager contracts, NOT a frozen EXE or installed Electron package." >> $env:GITHUB_STEP_SUMMARY
          "There is NO live licensed market feed, KAP/XIST import or trade release." >> $env:GITHUB_STEP_SUMMARY

  integrated-admin-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install backend API test runtime
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Real ASGI authentication and private endpoint safety
        run: |
          python -m pytest -q tests/test_bist_identity_api_auth.py tests/test_equity_coverage_api_auth.py tests/test_ebbot_packaged_react_probe.py -r a
      - name: Verify no user paths in REST data schemas
        run: |
          python -m unittest discover -s tests -p test_bist_identity_report_reader.py -v
          python -m unittest discover -s tests -p test_equity_data_coverage_reader.py -v

  integrated-full-react:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Entire React unit test suite, not just Data Center
        run: npm run test
      - name: All frontend lint and rules
        run: npm run lint
      - name: TypeScript and production Vite build
        run: npm run build
      - name: No release
        run: echo "Full React verification only. No electron installer, backend EXE, app signing, data license or trading." >> "$GITHUB_STEP_SUMMARY"

  integrated-data-center-ui-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Data Center panels and explicit legacy locale regression
        run: npm run test -- src/pages/__tests__/DataCenterPage.test.tsx src/components/data-center/EquityCoveragePanel.test.tsx src/components/data-center/BistIdentityPanel.test.tsx src/components/common/__tests__/Input.test.tsx src/components/theme/__tests__/ThemeToggle.test.tsx src/components/layout/__tests__/DesktopUpdateIndicator.test.tsx
      - name: Frontend lint
        run: npm run lint
      - name: TypeScript and production Vite build
        run: npm run build
      - name: Separate focused green does NOT supersede full React failure
        run: echo "This targeted test lane does not override full React regression failures or grant release." >> "$GITHUB_STEP_SUMMARY"
