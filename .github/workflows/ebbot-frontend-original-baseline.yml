name: EBBot original frontend baseline test report (diagnostic only)

on:
  push:
    branches: [audit/frontend-baseline-20261119]
  pull_request:
    branches: [audit/final-release-chain-20261119]

permissions:
  contents: read

jobs:
  baseline-react-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/final-release-chain-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run original unmodified 1482 React test suite (baseline, errors intentionally visible)
        run: npm test
