name: EBBot main branch protection truth (RELEASE BLOCKED / NO merge)

on:
  push:
    branches: [audit/ebbot-main-protection-release-blocker-20261120]

permissions:
  contents: read
  actions: read

concurrency:
  group: ebbot-main-protection-audit-only
  cancel-in-progress: true

jobs:
  verify-release-remains-blocked:
    name: Read-only branch/rulesets audit (report, NOT release approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SCHEDULE_ENABLED: 'false'
      RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
      RUNTIME_SCHEDULER_FORCE_ENABLED: 'false'
      RUNTIME_SCHEDULER_RUN_IMMEDIATELY: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
      MEME_COIN_TRADING_ENABLED: 'false'
      MEME_RADAR_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline branch and pinned CI provenance regressions (NO network)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_audit_main_release_protection.py' -v \
            2>&1 | tee branch-security-unittest.log
          python -m unittest discover -s tests -p 'test_audit_pinned_integration_ci_evidence.py' -v \
            2>&1 | tee pinned-integration-ci-unittest.log
      - name: Read public repo, branch, rulesets and PR130 metadata from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/ebbottr-cyber/ebbotcyber' > repository-evidence.json
          gh api 'repos/ebbottr-cyber/ebbotcyber/branches/main' > main-evidence.json
          gh api 'repos/ebbottr-cyber/ebbotcyber/rulesets?includes_parents=true' > rulesets-evidence.json
          gh api 'repos/ebbottr-cyber/ebbotcyber/pulls/130' > pr130-evidence.json
      - name: Evaluate main release blockers (never grants permission)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_main_release_protection \
            --repository repository-evidence.json \
            --branch main-evidence.json \
            --rulesets rulesets-evidence.json \
            --pr130 pr130-evidence.json \
            --out main-branch-release-blockers.json | tee main-branch-release-summary.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          record = json.loads(Path("main-branch-release-blockers.json").read_text(encoding="utf-8"))
          assert record["status"].startswith("BLOCKED_")
          assert record["approved_to_merge_main"] is False
          assert record["production_deployment_approved"] is False
          assert record["trading_enabled"] is False
          assert record["paper_trading_enabled"] is False
          assert record["live_trading_enabled"] is False
          assert record["scheduler_enabled"] is False
          assert record["orders"] == record["paper_fills"] == record["journal_writes"] == 0
          lines = [
              "## EBBot release readiness: **BLOCKED**",
              "",
              f"- GitHub main protection flag: **{record['main_protected_public_metadata']}**",
              f"- Rulesets reported: {record['repository_rulesets_reported']} / active {record['active_rulesets_reported']}",
              f"- Audit status: **{record['status']}**",
              f"- Reasons: {', '.join(record['release_blockers'])}",
              "- Actual effective required checks/reviews, force-push/deletion rules, bypass actors: **NOT VERIFIED**",
              "- Repo administrator must enable and verify protection in GitHub settings.",
              "- This job is an evidence-only PASS when it correctly flags BLOCKED; it does NOT authorize release.",
              "- No main merge, deployment, orders, portfolio updates or scheduled scans.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Fetch exact successful 3-job PINNED main plus PR122 GitHub Actions evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This is the previously completed run, not a new market-data capture.
          gh api 'repos/ebbottr-cyber/ebbotcyber/actions/runs/44813551015' > exact-integration-run.json
          gh api 'repos/ebbottr-cyber/ebbotcyber/actions/runs/44813551015/jobs?per_page=100' > exact-integration-jobs.json
          gh api 'repos/ebbottr-cyber/ebbotcyber/pulls/122' > pr122-evidence.json

      - name: Verify exact successful required CI jobs but KEEP RELEASE BLOCKED
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_pinned_integration_ci_evidence \
            --run exact-integration-run.json \
            --jobs exact-integration-jobs.json \
            --pr130 pr130-evidence.json \
            --pr122 pr122-evidence.json \
            --main main-evidence.json \
            --output pinned-ci-release-blockers.json | tee pinned-ci-release-blockers.log
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          out = json.loads(Path("pinned-ci-release-blockers.json").read_text(encoding="utf-8"))
          assert out["status"] == "PINNED_INTEGRATION_TESTS_VERIFIED_RELEASE_STILL_BLOCKED"
          assert out["verified_job_count"] == 3
          assert all(j["conclusion"] == "success" for j in out["jobs"])
          assert out["approved_to_merge_main"] is False
          assert out["production_deployment_approved"] is False
          assert out["orders"] == out["paper_fills"] == out["journal_writes"] == 0
          lines = [
              "## Verified exact integration CI; release remains BLOCKED",
              "",
              f"- Original GitHub run: {out['run_id']}",
              f"- Pinned main: {out['main_sha_under_test']}",
              f"- PR122 head: {out['pr122_sha_under_test']}",
              f"- Required completed SUCCESS jobs: {out['verified_job_count']}",
              "- Backend+React success is not branch-protection configuration",
              "- These branch-only audit job names must not be blindly selected as required checks on main",
              "- Effective admin rules, licenses and release constraints: UNVERIFIED",
              "- No main merge, deployment, schedules, brokers, paper/live orders or portfolio writes.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Archive redacted protection audit, never secrets or price feeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebbot-main-branch-release-blockers
          retention-days: 7
          if-no-files-found: warn
          path: |
            main-branch-release-blockers.json
            main-branch-release-summary.log
            branch-security-unittest.log
            pinned-integration-ci-unittest.log
            pinned-ci-release-blockers.json
            pinned-ci-release-blockers.log
