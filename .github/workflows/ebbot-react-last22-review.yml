name: EBBot React last22 review and all-suite truth (NO trades)

on:
  push:
    branches:
      - fix/ebbot-react-remaining22-tests-20261121

permissions:
  contents: read

concurrency:
  group: ebbot-react-last22-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEDULE_ENABLED: 'false'
  RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
  RUNTIME_SCHEDULER_FORCE_ENABLED: 'false'
  MEME_COIN_TRADING_ENABLED: 'false'
  MEME_COIN_DISCOVERY_ENABLED: 'false'
  MEME_RADAR_LIVE_ENABLED: 'false'

jobs:
  targeted:
    name: Ten remaining UI suites (never skip)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Run all ten previously failing suites
        run: |
          npx vitest run \
            src/pages/__tests__/DataCenterPage.test.tsx \
            src/pages/__tests__/DecisionSignalsPage.test.tsx \
            src/pages/__tests__/LoginPage.test.tsx \
            src/components/common/__tests__/Input.test.tsx \
            src/components/layout/__tests__/RouteBoundary.test.tsx \
            src/components/layout/__tests__/Shell.test.tsx \
            src/components/settings/__tests__/LLMChannelEditor.test.tsx \
            src/components/settings/__tests__/NotificationTestPanel.test.tsx \
            src/components/tasks/__tests__/TaskPanel.test.tsx \
            src/components/theme/__tests__/ThemeToggle.test.tsx

  full-vitest:
    name: Entire React Vitest, preserve genuine failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Entire Vitest suite with original exit code and JUnit
        shell: bash
        run: |
          set -euo pipefail
          if npm test -- --reporter=dot --reporter=junit --outputFile.junit=vitest-results.xml > vitest-console.log 2>&1; then
            tail -n 35 vitest-console.log
          else
            tail -n 95 vitest-console.log
            exit 1
          fi
      - name: Store full-suite truth whether passing or failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebbot-react-last22-full-vitest-evidence
          path: |
            apps/dsa-web/vitest-console.log
            apps/dsa-web/vitest-results.xml
          if-no-files-found: warn
          retention-days: 7

  independent-lint-build:
    name: Independent frontend lint + TypeScript/Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
