name: EBBot main + PR109 read-only release candidate gate

on:
  push:
    branches:
      - release-candidate/ebbot-main-pr109-offline-20261120
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ebbot-safe-release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-backend-offline:
    name: FULL offline backend pytest including main Solana
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCHEDULE_ENABLED: 'false'
      RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
      RUNTIME_SCHEDULER_FORCE_ENABLED: 'false'
      RUNTIME_SCHEDULER_RUN_IMMEDIATELY: 'false'
      MEME_RADAR_LIVE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
      MEME_COIN_TRADING_ENABLED: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Install backend CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Run EVERY offline backend test, including added Solana/merge contracts
        run: >
          python -m pytest -q -m "not network" --tb=line --disable-warnings
          --timeout=120 -o timeout_method=thread -o faulthandler_timeout=300
          --junitxml=rc-backend.xml
      - name: Store full backend failure details for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ebbot-rc-backend-junit
          path: rc-backend.xml
          if-no-files-found: warn
          retention-days: 7

  all-frontend:
    name: FULL React + production TS/Vite + native PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: Install exactly locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run entire Vitest suite (never filter failures)
        run: npm test -- --reporter=dot
      - name: ESLint
        run: npm run lint
      - name: Production TypeScript and Vite
        run: npm run build
      - name: Offline PWA and generated asset contracts
        run: PWA_REQUIRE_BUILD=1 npm run test:pwa

  safety-and-route-contracts:
    name: Distinct Solana routes, FX, disabled workflows and portfolio safety
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCHEDULE_ENABLED: 'false'
      RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
      MEME_RADAR_LIVE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Check both Solana APIs, no manual scan by default, disabled workflows
        run: >
          python -m pytest -q --tb=short
          tests/test_release_candidate_main_pr109_routes.py
          tests/test_solana_meme_api.py
          tests/test_disabled_workflows_remain_disabled.py
          tests/test_solana_history_quality.py
          tests/test_portfolio_historical_fx.py
          tests/test_portfolio_pr2.py
      - name: Independent FX fail-closed standalone tests
        run: >
          python -m pytest -q
          scripts/test_portfolio_display_fx_standalone.py
          scripts/test_portfolio_fx_fail_closed_standalone.py

  windows-readonly-preflight:
    name: Windows 2022 source/preflight (no Electron startup or orders)
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run safe Windows preflight unit tests
        run: python -m unittest discover -s tests -p test_windows_portfolio_preflight.py -v
      - name: Check source prerequisites without network, credentials or DB
        run: python scripts/ebbot_windows_portfolio_preflight.py --mode source --json
