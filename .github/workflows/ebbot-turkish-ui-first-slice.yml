name: EBBot Turkish UI test contract first-slice (NO trading)

on:
  push:
    branches: [fix/ebbot-turkish-ui-test-contract-first-slice-20261121]

permissions:
  contents: read

concurrency:
  group: ebbot-ui-zh-fixture-first-slice
  cancel-in-progress: true

env:
  SCHEDULE_ENABLED: 'false'
  RUNTIME_SCHEDULER_SUPPRESS_START: 'true'
  RUNTIME_SCHEDULER_FORCE_ENABLED: 'false'
  MEME_COIN_DISCOVERY_ENABLED: 'false'
  MEME_COIN_TRADING_ENABLED: 'false'
  MEME_RADAR_LIVE_ENABLED: 'false'

jobs:
  focused-react:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify explicit legacy Chinese test fixtures and Turkish product default
        shell: bash
        run: |
          set -euo pipefail
          npm test -- --reporter=dot \
            tests/ui_governance.test.ts \
            src/contexts/__tests__/UiLanguageContext.test.tsx \
            src/components/layout/__tests__/DesktopUpdateIndicator.test.tsx \
            src/pages/__tests__/AlertsPage.test.tsx
      - name: Lint the entire React project, including updated tests
        run: npm run lint
      - name: Build full TypeScript and Vite production bundle
        run: npm run build
