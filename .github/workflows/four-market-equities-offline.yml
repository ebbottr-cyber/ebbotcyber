name: EBBot Four Equity Markets (offline)

on:
  push:
    branches:
      - feat/four-market-equity-audit-v1
  pull_request:
    branches:
      - feat/all-markets-paper-universe-v1
    paths:
      - 'src/services/four_market_equity.py'
      - 'scripts/audit_four_market_equities.py'
      - 'tests/test_four_market_equities.py'
      - '.github/workflows/four-market-equities-offline.yml'

permissions:
  contents: read

jobs:
  four-market-candidate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline four-market and Xetra parser tests
        run: python -m unittest discover -s tests -p 'test_four_market_equities.py' -v
      - name: Stock universe report (no network and no trading)
        run: python -m scripts.audit_four_market_equities
