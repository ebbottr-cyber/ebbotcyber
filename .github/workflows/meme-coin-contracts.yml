name: Meme Coin Contracts

on:
  pull_request:
    paths:
      - 'src/services/meme_coin_*'
      - 'api/v1/endpoints/meme_coin.py'
      - 'api/v1/schemas/meme_coin.py'
      - 'apps/dsa-web/src/api/memeCoin.ts'
      - 'apps/dsa-web/src/pages/MemeCoinPage.tsx'
      - 'apps/dsa-web/src/pages/__tests__/MemeCoinPage.test.tsx'
      - 'tests/test_meme_coin_*'
      - '.github/workflows/meme-coin-contracts.yml'
  push:
    branches:
      - 'feat/meme-coin-solana-risk-v4'
      - 'feat/meme-coin-holder-risk-v5'
      - 'feat/meme-coin-liquidity-owner-v6'
      - 'feat/meme-coin-orca-vault-audit-v7'
      - 'feat/meme-coin-paper-replay-v8'
      - 'feat/meme-coin-jupiter-quote-v9'
      - 'feat/meme-coin-journal-circuit-v10'
    paths:
      - 'src/services/meme_coin_*'
      - 'api/v1/endpoints/meme_coin.py'
      - 'api/v1/schemas/meme_coin.py'
      - 'apps/dsa-web/src/api/memeCoin.ts'
      - 'apps/dsa-web/src/pages/MemeCoinPage.tsx'
      - 'apps/dsa-web/src/pages/__tests__/MemeCoinPage.test.tsx'
      - 'tests/test_meme_coin_*'
      - '.github/workflows/meme-coin-contracts.yml'

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Test isolated read-only meme coin contracts
        run: pytest -q tests/test_meme_coin_strategy_panel.py tests/test_meme_coin_discovery.py tests/test_meme_coin_robinhood.py tests/test_meme_coin_solana_risk.py tests/test_meme_coin_solana_holders.py tests/test_meme_coin_solana_pool.py tests/test_meme_coin_solana_owner_groups.py tests/test_meme_coin_solana_orca.py tests/test_meme_coin_paper_replay.py tests/test_meme_coin_jupiter_quotes.py tests/test_meme_coin_quote_bridge.py tests/test_meme_coin_quote_journal.py tests/test_meme_coin_paper_guard.py

  frontend-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Test Meme Coin panel independently
        run: npm test -- MemeCoinPage.test.tsx
