name: Solana Meme Radar focused checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'data_provider/solana_meme.py'
      - 'src/services/solana_meme_radar.py'
      - 'scripts/scan_solana_meme.py'
      - 'api/v1/endpoints/meme_coins.py'
      - 'tests/test_solana_meme*.py'
      - 'apps/dsa-web/src/pages/MemeCoinsPage.tsx'
      - 'apps/dsa-web/src/pages/__tests__/MemeCoinsPage.test.tsx'
      - 'apps/dsa-web/src/api/memeRadar.ts'
      - 'apps/dsa-web/src/App.tsx'
      - 'apps/dsa-web/src/components/layout/SidebarNav.tsx'
      - '.github/workflows/meme-radar-verify.yml'

permissions:
  contents: read

jobs:
  python-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Compile changed Python files
        run: python -m py_compile data_provider/solana_meme.py src/services/solana_meme_radar.py scripts/scan_solana_meme.py api/v1/endpoints/meme_coins.py
      - name: Run isolated Meme Radar backend tests
        run: python -m pytest -q tests/test_solana_meme_radar.py tests/test_solana_meme_api.py

  web-radar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Meme Radar UI test
        run: npx vitest run src/pages/__tests__/MemeCoinsPage.test.tsx
      - name: Typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
