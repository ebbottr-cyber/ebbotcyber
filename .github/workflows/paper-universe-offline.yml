name: EBBot All-Markets Paper Universe (offline)

on:
  push:
    branches: [feat/all-markets-paper-universe-v1]
  pull_request:
    branches: [main]
    paths:
      - 'src/services/paper_universe_inventory.py'
      - 'scripts/audit_paper_universe.py'
      - 'tests/test_paper_universe_inventory.py'
      - '.github/workflows/paper-universe-offline.yml'
      - 'apps/dsa-web/public/stocks.index.json'

permissions:
  contents: read

jobs:
  inventory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test full-index and manifest inventory
        run: python -m unittest discover -s tests -p 'test_paper_universe_inventory.py' -v
      - name: Print all-market offline audit counts
        run: python -m scripts.audit_paper_universe
