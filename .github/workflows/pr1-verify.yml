name: "PR #1 Verification"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr1-verify-${{ github.event.pull_request.head.repo.full_name }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Run Python tests
        run: pytest -q

# Read-only one-symbol-per-market smoke. The provider-fallback test does NOT
  # validate entire markets, prioritized providers, LLM reports, or trade flows.
  six-market-live-yahoo:
    if: >-
      github.head_ref == 'test/six-markets-live-smoke' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing backend dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Verify actual Yahoo market history, currency and technical score
        shell: bash
        run: |
          set -euo pipefail
          python -m src.services.six_market_live_smoke \
            --as-of 2026-11-15 \
            --output "$RUNNER_TEMP/six-market-yahoo-2026-11-15.json" \
            2> "$RUNNER_TEMP/six-market-yahoo.stderr.log"
      - name: Upload read-only six-market probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-market-yahoo-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/six-market-yahoo-*.json
            ${{ runner.temp }}/six-market-yahoo*.log
          if-no-files-found: warn
          retention-days: 7
