name: PR #1 Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr1-verify-${{ github.event.pull_request.head.repo.full_name }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Run Python tests
        run: pytest -q
