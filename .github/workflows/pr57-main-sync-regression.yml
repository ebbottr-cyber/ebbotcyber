name: EBBot PR57 main-sync regression (no trading)

on:
  push:
    branches:
      - fix/pr57-main-sync-20261119
  pull_request:
    branches:
      - review/ebbot-3lu-entegrasyon-20261118

permissions:
  contents: read

jobs:
  merged-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr57-main-sync-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Combined meme UIs and locale tests
        run: npm test -- src/pages/__tests__/MemeCoinPage.test.tsx src/pages/__tests__/MemeCoinsPage.test.tsx src/utils/__tests__/systemConfigLanguage.test.ts tests/system_config_i18n.test.ts
      - name: Validate merged TypeScript and Vite production build
        run: npm run build

  merged-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SCHEDULE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
      MEME_RADAR_LIVE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr57-main-sync-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: Combined Solana and Turkey read-only endpoints
        run: |
          python -m pytest -q --tb=short \
            tests/test_solana_meme_api.py \
            tests/test_solana_meme_radar.py \
            tests/test_meme_coin_strategy_panel.py \
            tests/test_tr_market_overview_service.py
