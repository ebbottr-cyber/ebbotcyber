name: EBBot PR57 conflict resolution offline preview

on:
  push:
    branches:
      - fix/pr57-main-sync-20261119
  pull_request:
    branches:
      - review/ebbot-3lu-entegrasyon-20261118

permissions:
  contents: read

jobs:
  verify-conflict-resolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify controlled merge in disposable runner (no push)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = 2aade1eb43489483f3e18c1e04cb8d0849cf4900
          set +e
          git -c user.name=Audit -c user.email=audit@example.invalid merge --no-commit --no-ff origin/main
          result=$?
          set -e
          test "$result" -ne 0
          python .github/scripts/resolve_pr57_main.py
          git add -A
          test -z "$(git ls-files -u)"
          git diff --cached --check
          echo RESOLUTION_STAGED_AND_VALID=true
          echo NO_REF_OR_BRANCH_WAS_CHANGED=true
          git diff --cached --stat
          git merge --abort
