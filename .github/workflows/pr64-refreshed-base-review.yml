name: EBBot PR64 Xetra 1750 panel review (no trade)

on:
  push:
    branches: [integration/pr64-xetra-panel-sync-20261119]
  pull_request:
    branches: [feat/xetra-quote-guard-v1]

permissions:
  contents: read

jobs:
  xetra-review-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      SCHEDULE_ENABLED: 'false'
      EBBOT_XETRA_QUOTES_UI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr64-xetra-panel-sync-20261119
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert updated PR62 dependency
        run: |
          git fetch origin feat/xetra-quote-guard-v1
          test "$(git rev-parse origin/feat/xetra-quote-guard-v1)" = da5b666cefa538c9c8f6d734158a387aae126cc2
          git merge-base --is-ancestor da5b666cefa538c9c8f6d734158a387aae126cc2 HEAD
          echo "PR62_BASE_TREE_SHA=$(git rev-parse 'da5b666cefa538c9c8f6d734158a387aae126cc2^{tree}')"
          echo "NO_MAIN_OR_PARENT_PR_WRITES=true"
      - run: python -m pip install -r .github/requirements-ci.txt
      - name: API, quote metadata guard, official Xetra reference and inventory
        run: |
          python -m unittest discover -s tests -p 'test_xetra_quote_guard.py' -v
          python -m unittest discover -s tests -p 'test_xetra_dashboard_api.py' -v
          python -m unittest discover -s tests -p 'test_four_market_equities.py' -v
          python -m unittest discover -s tests -p 'test_paper_universe_inventory.py' -v
          python -m scripts.verify_xetra_quotes

  xetra-review-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/pr64-xetra-panel-sync-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Germany panel and Python/React payload mapping tests
        run: npm test -- src/pages/__tests__/GermanyMarketPage.test.tsx src/api/__tests__/xetraResponseContract.test.ts
      - name: Production typecheck and build
        run: npm run build
