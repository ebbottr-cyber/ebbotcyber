name: Solana fixed-mint time-spaced observations (read only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/solana-market-observations.yml'
      - 'scripts/collect_solana_observations.py'
      - 'tests/test_solana_observations.py'

permissions:
  contents: read

concurrency:
  group: solana-observations-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  one-off-public-observations:
    name: Three public price observations, no orders
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      MEME_RADAR_LIVE_ENABLED: 'false'
      SCHEDULE_ENABLED: 'false'
      RUN_IMMEDIATELY: 'false'
      WEBUI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Test safety limits and exact-mint time continuity offline
        run: python -m pytest -q tests/test_solana_observations.py
      - name: Record THREE public observations 60 seconds apart, max TWO mints
        run: |
          python -m scripts.collect_solana_observations \
            --live --rounds 3 --interval 60 --limit 2 \
            --output solana-public-observations.json
      - name: Upload read-only observation artifact even if a provider fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solana-public-observations-not-paper-trades
          path: solana-public-observations.json
          if-no-files-found: warn
          retention-days: 7
