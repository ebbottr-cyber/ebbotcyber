name: Strategy Lab V9 prospective paper contracts

on:
  pull_request:
    branches:
      - feat/strategy-lab-walk-forward-v8

permissions:
  contents: read

concurrency:
  group: strategy-paper-v9-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prospective-paper-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Syntax validation
        run: python -m py_compile src/core/prospective_paper.py src/services/prospective_paper_journal.py scripts/observe_etf_paper_v9.py tests/test_prospective_paper.py
      - name: Check no-lookahead and append-only paper journal contracts
        run: python -m pytest -q tests/test_prospective_paper.py tests/test_temporal_validation.py tests/test_rotation_timing_adapter.py
