name: Strategy Lab targeted validation

on:
  pull_request:
    branches:
      - feat/rotation-random-benchmark-bridge-v1

permissions:
  contents: read

concurrency:
  group: strategy-lab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Python syntax check
        run: python -m py_compile src/core/random_benchmark.py src/core/rotation_timing_adapter.py src/services/strategy_lab_service.py api/v1/endpoints/strategy_lab.py
      - name: Core and API contract tests
        run: python -m pytest -q tests/test_random_benchmark.py tests/test_rotation_timing_adapter.py tests/test_strategy_lab_service.py

  strategy-lab-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Strategy Lab component tests
        run: npx vitest run src/pages/__tests__/StrategyLabPage.test.tsx
      - name: Frontend typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
