name: Strategy Lab V8 temporal validation

on:
  pull_request:
    branches:
      - feat/provider-consistency-v7

permissions:
  contents: read

concurrency:
  group: strategy-lab-v8-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  temporal-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI requirements
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Validate source syntax
        run: python -m py_compile src/core/temporal_validation.py tests/test_temporal_validation.py scripts/smoke_strategy_lab_temporal.py
      - name: Run temporal no-lookahead and boundary tests
        run: python -m pytest -q tests/test_temporal_validation.py tests/test_random_benchmark.py tests/test_rotation_timing_adapter.py

  temporal-real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EFINANCE_CALL_TIMEOUT: "12"
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI requirements
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Read-only chronological holdout on real adjusted ETF data
        run: PYTHONPATH=. python scripts/smoke_strategy_lab_temporal.py
