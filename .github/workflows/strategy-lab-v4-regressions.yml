name: Strategy Lab V4 regression validation

on:
  pull_request:
    branches:
      - feat/strategy-success-lab-v1

permissions:
  contents: read

concurrency:
  group: strategy-lab-v4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Python syntax check
        run: python -m py_compile src/core/random_benchmark.py src/core/rotation_timing_adapter.py src/services/strategy_lab_service.py api/v1/endpoints/strategy_lab.py
      - name: Core and API contract tests
        run: python -m pytest -q tests/test_random_benchmark.py tests/test_rotation_timing_adapter.py tests/test_strategy_lab_service.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Strategy Lab and Turkish regression component tests
        run: npx vitest run src/pages/__tests__/StrategyLabPage.test.tsx src/components/decision-signals/__tests__/DecisionSignalDisplay.test.tsx src/components/decision-signals/__tests__/DecisionSignalTimeline.test.tsx src/components/run-flow/__tests__/RunFlowEventList.test.tsx src/components/run-flow/__tests__/RunFlowGraph.test.tsx src/components/run-flow/__tests__/RunFlowNodeDetails.test.tsx src/components/settings/__tests__/NotificationTestPanel.test.tsx src/utils/__tests__/systemConfigLanguage.test.ts
      - name: Frontend typecheck
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Frontend build
        run: npm run build

  live-price-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      EFINANCE_CALL_TIMEOUT: "12"
    steps:
      - name: Checkout PR merge
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Strict read-only real price provider smoke
        run: PYTHONPATH=. python scripts/smoke_strategy_lab_real_data.py
