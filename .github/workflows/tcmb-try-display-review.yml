name: EBBot TCMB TRY read-only integration review

on:
  push:
    branches: [feat/tcmb-try-display-review-20261120]
  pull_request:
    branches: [fix/turkish-visible-text-fx-review-20261120]

permissions:
  contents: read

jobs:
  backend-tcmb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Compile backend API, parser, and tests
        run: python -m py_compile api/v1/endpoints/portfolio.py api/v1/schemas/portfolio.py src/services/tcmb_try_display_service.py tests/test_tcmb_try_display_service.py
      - name: TCMB display and portfolio API regression
        run: python -m pytest -q tests/test_tcmb_try_display_service.py tests/test_portfolio_api.py
  frontend-tcmb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Guarded quote and Turkish display unit regression
        env:
          VITE_EBBOT_TURKISH_TEST_MODE: 'true'
        run: npm test -- src/utils/__tests__/tryDisplayFx.test.ts src/utils/__tests__/portfolioFormat.test.ts src/utils/__tests__/formatLocalization.test.ts src/utils/__tests__/turkishOnlyOperatorUi.test.tsx
      - name: Portfolio TRY UI integration without unrelated legacy locale tests
        run: npm test -- src/pages/__tests__/PortfolioPage.test.tsx -t "TCMB TRY display"
      - name: ESLint and production build
        run: |
          npm run lint
          npm run build
      - name: PWA smoke
        run: PWA_REQUIRE_BUILD=1 npm run test:pwa
