name: EBBot source publication-day evidence (NO trades / NO scheduler)

on:
  push:
    branches: [audit/tr-fx-publication-progress-20261120]

permissions:
  contents: read

concurrency:
  group: ebbot-tr-fx-publication-progress
  cancel-in-progress: true

jobs:
  observation-vs-publication-days:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SCHEDULE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
      MEME_RADAR_LIVE_ENABLED: 'false'
      EBBOT_XETRA_QUOTES_UI_ENABLED: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      GUARD_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing CI requirements and no-network test plugin
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pip install pytest-socket
      - name: Offline fail-closed quote and publication date regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --disable-socket --allow-unix-socket --tb=short \
            tests/test_audit_tr_fx_multiday_continuity.py \
            tests/test_audit_tr_fx_cross_sources.py \
            tests/test_audit_tr_fx_public_sources.py \
            tests/test_tr_market_overview_service.py \
            tests/test_tcmb_try_display_service.py \
            --junitxml=tr-fx-publication-days-tests.xml 2>&1 | tee tr-fx-publication-days-tests.log
      - name: One fixed-scope public Yahoo daily and official TCMB observation (read only)
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_tr_fx_public_sources --fetch | tee tr-fx-publication-source.json
      - name: Verify one real observation never establishes multiple days or data freshness
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.audit_tr_fx_multiday_continuity \
            --input tr-fx-publication-source.json \
            | tee tr-fx-publication-days-evidence.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("tr-fx-publication-days-evidence.json").read_text(encoding="utf-8"))
          assert report["status"] == "INSUFFICIENT_DISTINCT_DATES"
          assert report["distinct_observation_dates"] == 1
          assert report["total_observations"] == 1
          assert not report["provider_publication_days_all_advanced"]
          assert all(row["distinct_publication_dates"] <= 1
                     for row in report["provider_publication_evidence"].values())
          assert not report["long_term_reliability_proven"]
          assert not report["independent_bist_second_source_verified"]
          assert not report["licensed_non_display_market_data_access_verified"]
          assert not report["prices_executable"]
          assert report["orders"] == report["paper_fills"] == report["journal_writes"] == 0
          PY
      - name: Publish transparent evidence limitations
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("tr-fx-publication-days-evidence.json").read_text(encoding="utf-8"))
          lines = [
              "## Read-only market observation vs actual provider publication",
              "",
              f"- Independent observation dates: {report['distinct_observation_dates']}",
              f"- Result: {report['status']}",
              "- Actual publication dates kept separately for each of the 7 sources",
              "- Two observation days carrying the same published price do NOT prove fresh market updates",
              "- Missing dates/holidays/trading sessions are never fabricated",
              "- BIST licensed independent second source: not configured",
              "- All prices are indicative or delayed, never trade executable",
              "- Scheduler/paper trading/live trading/portfolio writes: DISABLED",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("\n".join(lines) + "\n")
          PY
      - name: Archive the real read-only observation and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr-fx-publication-day-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            tr-fx-publication-source.json
            tr-fx-publication-days-evidence.json
            tr-fx-publication-days-tests.xml
            tr-fx-publication-days-tests.log
