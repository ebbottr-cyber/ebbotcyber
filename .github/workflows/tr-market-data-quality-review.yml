name: EBBot TR market data integrity - strict offline (NO orders)

on:
  push:
    branches: [audit/tr-market-data-truth-20261120]

permissions:
  contents: read

concurrency:
  group: ebbot-tr-market-data-truth-review
  cancel-in-progress: true

jobs:
  offline-market-data-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SCHEDULE_ENABLED: 'false'
      MEME_COIN_DISCOVERY_ENABLED: 'false'
      MEME_RADAR_LIVE_ENABLED: 'false'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum test runner and socket denial
        run: python -m pip install pytest pytest-socket
      - name: Verify quote freshness, missing/invalid price, and fail-closed risk evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --disable-socket --tb=short \
            tests/test_tr_market_overview_service.py \
            tests/test_paper_market_data_quality.py \
            tests/test_decision_signal_data_quality.py \
            --junitxml=tr-market-data-quality.xml 2>&1 | tee tr-market-data-quality.log
      - name: Preserve read-only quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tr-market-data-quality-offline
          path: |
            tr-market-data-quality.xml
            tr-market-data-quality.log
          retention-days: 7
          if-no-files-found: warn
