name: EBBot Turkish-only UI migration checks (review only)

on:
  push:
    branches: [fix/turkish-only-ui-review-20261119]
  pull_request:
    branches: [audit/final-release-chain-20261119]

permissions:
  contents: read

jobs:
  locale-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/turkish-only-ui-review-20261119
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dsa-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: All frontend tests, including legacy locales and Germany market
        run: npm test
      - name: ESLint for compatibility regressions
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
      - name: PWA asset checks
        run: PWA_REQUIRE_BUILD=1 npm run test:pwa
