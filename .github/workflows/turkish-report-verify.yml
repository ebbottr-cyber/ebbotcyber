name: Turkish report regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/market_context.py'
      - 'src/report_language.py'
      - 'src/analyzer.py'
      - 'src/services/empty_news.py'
      - 'src/services/report_renderer.py'
      - 'tests/test_analyzer_prompt_language.py'
      - 'tests/test_notification_empty_news_disclosure.py'
      - '.github/workflows/turkish-report-verify.yml'

permissions:
  contents: read

jobs:
  turkish-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Compile market context and reporting modules
        run: python -m py_compile src/market_context.py src/services/empty_news.py
      - name: Verify Turkish prompt and disclosure behavior
        run: python -m pytest -q tests/test_analyzer_prompt_language.py tests/test_notification_empty_news_disclosure.py
