name: EBBot Xetra Stock Universe Import (source-only)

on:
  push:
    branches:
      - feat/four-market-equity-audit-v1
    paths:
      - '.github/workflows/xetra-market-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-xetra-stock-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-market-equity-audit-v1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obtain source, filter to common stock and verify real rows
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 90 --max-filesize 67108864 \
            --proto '=https' --proto-redir '=https' \
            'https://www.cashmarket.deutsche-boerse.com/resource/blob/1528/b52ea43a2edac92e8283d40645d1c076/data/t7-xetr-allTradableInstruments.csv' \
            --output "$workdir/xetra-original.csv"
          python -m scripts.audit_four_market_equities \
            --xetra-input "$workdir/xetra-original.csv" \
            --xetra-output "$workdir/xetra-candidates.csv" > "$workdir/audit.json"
          python - "$workdir/xetra-candidates.csv" "$workdir/audit.json" <<'PY'
          import csv, json, sys
          from pathlib import Path
          manifest, report = map(Path, sys.argv[1:])
          rows = list(csv.DictReader(manifest.open(encoding="utf-8", newline="")))
          audit = json.loads(report.read_text(encoding="utf-8"))["xetra_source_audit"]
          if audit["status"] != "XETRA_CANDIDATES_ONLY" or len(rows) < 100:
              raise SystemExit("BLOCKED: untrusted or truncated Xetra source")
          if len(rows) != audit["included_common_stocks"]:
              raise SystemExit("BLOCKED: stock count mismatch")
          if len({row["symbol"] for row in rows}) != len(rows):
              raise SystemExit("BLOCKED: duplicate stock tickers")
          if any(
              row.get("source_as_of_date") != audit["source_as_of_date"]
              or row.get("market") != "de"
              or row.get("source") != "deutsche_boerse_xetra_t7"
              or row.get("kind") != "stock"
              or row.get("price_symbol_verified") != "false"
              for row in rows
          ):
              raise SystemExit("BLOCKED: invalid stock manifest provenance")
          print("Xetra source date:", audit["source_as_of_date"])
          print("Active common stock candidates:", len(rows))
          print("Snapshot has no quotes, broker authorizations or trading privileges.")
          PY
          mkdir -p data/market_snapshots/de
          cp "$workdir/xetra-candidates.csv" data/market_snapshots/de/xetra-candidates.csv
          python -m scripts.audit_four_market_equities > "$workdir/loaded-audit.json"
          python - "$workdir/loaded-audit.json" "$workdir/audit.json" <<'PY'
          import json, sys
          from pathlib import Path
          loaded, raw = (json.loads(Path(s).read_text(encoding="utf-8")) for s in sys.argv[1:])
          expected = raw["xetra_source_audit"]["included_common_stocks"]
          if not loaded.get("stored_xetra_manifest_loaded") or loaded["candidate_stocks_by_market"]["de"] != expected:
              raise SystemExit("BLOCKED: Germany stock universe not loaded")
          if loaded["orders"] != 0 or loaded["paper_trading_enabled"] or loaded["live_trading_enabled"]:
              raise SystemExit("BLOCKED: unsafe trading state")
          print("EBBot snapshot registered with", expected, "German share candidates")
          PY
      - name: Commit Germany source-derived inventory to this draft branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/market_snapshots/de/xetra-candidates.csv
          if git diff --cached --quiet; then
            echo "No snapshot difference; nothing to commit."
          else
            git commit -m "data(xetra): import latest official common-stock candidates (no quotes)"
            git push origin HEAD:refs/heads/feat/four-market-equity-audit-v1
          fi
