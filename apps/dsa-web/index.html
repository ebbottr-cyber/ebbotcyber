<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="description" content="EBBot: AI destekli piyasa analizi, portföy ve risk takip paneli." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EBBot" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/ebbot.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/ebbot-apple-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        const storageKey = 'theme';
        const root = document.documentElement;
        let storedTheme = null;
        try { storedTheme = localStorage.getItem(storageKey); } catch { /* Storage disabled */ }
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'light';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <title>EBBot | Yapay Zekâ Yatırım Analizi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
